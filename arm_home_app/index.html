<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ArmHome — Недвижимость Армении</title>
    <meta name="description" content="ArmHome — лучший сервис для поиска квартир, домов и коммерческой недвижимости в Ереване и Армении. Интерактивная карта, реальные объявления, AI-оценка цен." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(event) {
        // Игнорируем безобидные внутренние ошибки стороннего скрипта Google reCAPTCHA
        if (
          (event.filename && event.filename.indexOf('recaptcha') !== -1) ||
          (event.message && event.message.indexOf('recaptcha') !== -1)
        ) {
          return;
        }
        var errorDiv = document.getElementById('debug-error-overlay');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error-overlay';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.height = '100%';
          errorDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.95)';
          errorDiv.style.color = 'white';
          errorDiv.style.padding = '20px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.overflow = 'auto';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.lineHeight = '1.5';
          document.body.appendChild(errorDiv);
        }
        var msg = document.createElement('pre');
        msg.textContent = 'ERROR:\n' + event.message + '\nat ' + event.filename + ':' + event.lineno + ':' + event.colno + '\n\nStack:\n' + (event.error ? event.error.stack : 'No stacktrace available');
        errorDiv.appendChild(msg);
      });
      window.addEventListener('unhandledrejection', function(event) {
        // Игнорируем безобидные внутренние ошибки стороннего скрипта Google reCAPTCHA
        if (
          event.reason && 
          ((event.reason.message && event.reason.message.indexOf('recaptcha') !== -1) ||
           (event.reason.stack && event.reason.stack.indexOf('recaptcha') !== -1))
        ) {
          return;
        }
        var errorDiv = document.getElementById('debug-error-overlay');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error-overlay';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.height = '100%';
          errorDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.95)';
          errorDiv.style.color = 'white';
          errorDiv.style.padding = '20px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.overflow = 'auto';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.lineHeight = '1.5';
          document.body.appendChild(errorDiv);
        }
        var msg = document.createElement('pre');
        msg.textContent = 'UNHANDLED REJECTION:\n' + event.reason + '\n\nStack:\n' + (event.reason ? event.reason.stack : 'No stacktrace available');
        errorDiv.appendChild(msg);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Постоянный и безопасный контейнер для reCAPTCHA, защищенный от размонтирования React -->
    <div id="recaptcha-container"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
