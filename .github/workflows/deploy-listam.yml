name: Deploy List.am page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-listam.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy page
        id: deployment
        uses: actions/deploy-pages@v4
